<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steadfast">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<style>html,body{margin:0;background:#080B12;color:#fff}</style>
<script src="/shim.js"></script>
</head><body><title>Steadfast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Steadfast: a daily operating system for body, faith, finances, discipline and journaling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: one 520px command-center column; layered navy cards on near-black; glass dock fixed at the bottom; sheets slide up for every form. */
:root{
  --bg:#080B12; --bg2:#101D35; --card:#142440; --card-hi:#1A2E52; --blue:#438BFA; --ice:#8DBBFF; --text:#FFFFFF; --muted:#8FA9D2;
  --neon:#00D4FF; --red:#FF3B5C; --red-glow:rgba(255,59,92,.45); --line:rgba(141,187,255,.12); --line2:rgba(141,187,255,.24); --track:rgba(141,187,255,.13); --glow:rgba(67,139,250,.38); --field:#0C1628;
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-verse:'Newsreader',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(90% 45% at 85% -8%,rgba(67,139,250,.22),transparent 65%),radial-gradient(70% 40% at -10% 30%,rgba(16,29,53,.9),transparent 70%)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(118px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--text)}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* Type */
.display{font-family:var(--f-display);font-stretch:125%;font-weight:800;letter-spacing:-.01em;line-height:1.02;text-wrap:balance}
.h1{font-size:clamp(28px,8vw,36px)}
.h2{font-size:20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.ice{color:var(--ice)}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:10px}
.wm{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:13px;letter-spacing:.24em}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(20,36,64,.7);border:1px solid var(--line);color:var(--ice)}
.icon-btn svg{width:22px;height:22px}
.page-head{display:flex;align-items:center;gap:12px}
.page-head .display{font-size:30px;letter-spacing:.02em}
.page-head .icon-btn{flex:none}

/* Cards */
.card{background:linear-gradient(180deg,var(--card),#112039);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flat{background:var(--bg2)}
.card.hero{background:radial-gradient(120% 120% at 100% 0%,rgba(67,139,250,.28),transparent 55%),linear-gradient(160deg,#17305A,#0F1D36 70%);border-color:var(--line2);box-shadow:0 20px 60px -30px var(--glow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head .t{display:flex;align-items:center;gap:10px;min-width:0}
.card-head h2{font-size:17px;font-weight:800;letter-spacing:.02em}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 2px 0}
.section-title h2{font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(8,11,18,.35);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-size:24px;font-weight:800;font-stretch:110%;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.divider{height:1px;background:var(--line)}
.note{font-size:14px;color:var(--muted);line-height:1.5}
.note b{color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:.03em;background:rgba(67,139,250,.16);color:var(--ice);border:1px solid rgba(67,139,250,.35);white-space:nowrap}
.pill.solid{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill.quiet{background:transparent;color:var(--muted);border-color:var(--line2)}

/* Buttons */
.btn{text-decoration:none;min-height:54px;padding:0 20px;border-radius:17px;font-weight:800;font-size:16px;letter-spacing:.02em;background:linear-gradient(180deg,#5196FF,var(--blue));color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 30px -14px var(--glow);transition:transform .15s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:rgba(67,139,250,.08);color:var(--ice);border:1px solid var(--line2);box-shadow:none}
.btn.quiet{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line)}
.btn.sm{min-height:44px;font-size:14.5px;padding:0 14px;border-radius:14px}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1;min-width:0}
.link{color:var(--ice);font-weight:700;font-size:14.5px;min-height:44px;display:inline-flex;align-items:center;gap:6px}

/* Progress */
.bar{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--ice));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:7px}
.bar.big{height:16px}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring circle{transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring-in{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1}
.ring-in b{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-variant-numeric:tabular-nums}
.ring-in span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-top:4px}
.metric{display:flex;flex-direction:column;gap:7px}
.metric .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metric .top-line b{font-variant-numeric:tabular-nums;font-size:17px}
.metric .top-line span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Checklist */
.checks{display:flex;flex-direction:column;gap:8px}
.ck{width:100%;min-height:58px;display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:17px;background:rgba(8,11,18,.32);border:1px solid var(--line);text-align:left;transition:background .2s,border-color .2s}
.ck .box{width:30px;height:30px;flex:none;border-radius:10px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;transition:all .2s}
.ck .box svg{width:18px;height:18px}
.ck .lbl{flex:1;font-weight:650;font-size:16px;min-width:0}
.ck .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ck.on{background:rgba(67,139,250,.12);border-color:rgba(67,139,250,.4)}
.ck.on .box{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 18px -4px var(--glow)}
.ck.on .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(141,187,255,.5)}
.auto-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:2px 6px}

/* Accordion categories */
.cats{display:flex;flex-direction:column;gap:10px}
.cat{border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),#10203A);overflow:hidden;transition:border-color .3s,box-shadow .3s}
.cat.open{border-color:var(--line2);box-shadow:0 16px 50px -30px var(--glow)}
.cat-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px;text-align:left;min-height:80px}
.cat-ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--ice);background:linear-gradient(150deg,rgba(67,139,250,.28),rgba(16,29,53,.6));border:1px solid rgba(141,187,255,.2)}
.cat-ic svg{width:26px;height:26px}
.cat-name{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:18px;letter-spacing:.08em}
.cat-sub{font-size:13.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-txt{flex:1;min-width:0}
.cat-chev{color:var(--muted);transition:transform .35s}
.cat.open .cat-chev{transform:rotate(180deg)}
.cat-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.8,.2,1)}
.cat.open .cat-body{grid-template-rows:1fr}
.cat-body>div{overflow:hidden}
.cat-inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.cat.faith .cat-ic{background:linear-gradient(150deg,rgba(141,187,255,.22),rgba(8,11,18,.6))}

/* Home hero */
.hello .date{color:var(--ice);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.hello h1{margin-top:6px}
.hero-grid{display:flex;align-items:center;gap:18px}
.hero-list{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.hero-item{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.hero-item .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.06em}
.hero-item .lab span{color:var(--muted);font-variant-numeric:tabular-nums}
.prio{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line)}
.prio:last-child{border-bottom:0}
.prio .n{font-family:var(--f-display);font-stretch:125%;font-weight:800;color:var(--blue);width:18px}
.prio input{flex:1;min-width:0;background:transparent;border:0;font-size:16.5px;font-weight:600;padding:10px 0}
.prio input::placeholder{color:rgba(143,169,210,.55)}
.prio.done input{color:var(--muted);text-decoration:line-through}
.mini-ck{width:32px;height:32px;border-radius:10px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;flex:none}
.mini-ck svg{width:18px;height:18px}
.mini-ck.on{background:var(--blue);border-color:var(--blue);color:#fff}
.big-num{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big-num small{font-size:16px;font-weight:600;color:var(--muted);font-stretch:100%;letter-spacing:0;margin-left:6px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:36px;height:44px;border-radius:12px;display:grid;place-items:center;color:rgba(141,187,255,.35);border:1px solid var(--line);background:rgba(8,11,18,.3)}
.drop svg{width:20px;height:20px}
.drop.on{color:var(--ice);background:rgba(67,139,250,.2);border-color:rgba(67,139,250,.45)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,rgba(67,139,250,.22),rgba(20,36,64,.5));border:1px solid rgba(67,139,250,.35);font-size:14.5px}
.banner svg{flex:none;width:22px;height:22px;color:var(--ice);margin-top:1px}

/* Tabs */
.seg{display:flex;gap:6px;padding:5px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:44px;padding:0 10px;border-radius:13px;font-weight:700;font-size:14.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card-hi);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:4px}
.datenav b{font-size:15.5px;text-align:center;flex:1}
.datenav .icon-btn{background:transparent;border:0;width:44px;height:44px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:650;font-size:15.5px;overflow:hidden;text-overflow:ellipsis}
.li .main span{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.li .end{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.li .end span{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.li .icon-btn{width:40px;height:40px;background:transparent}
.empty{padding:14px;border:1px dashed var(--line2);border-radius:16px;color:var(--muted);font-size:14.5px;text-align:center}
.time{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--ice);width:50px;flex:none;letter-spacing:.02em}

/* Charts */
.chart{width:100%;height:auto;display:block}
.bars7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.bars7 .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars7 .b{width:100%;max-width:30px;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,var(--ice),var(--blue));min-height:4px;transition:height .5s}
.bars7 .b.zero{background:var(--track)}
.bars7 .col span{font-size:11.5px;color:var(--muted);font-weight:700}
.bars7 .col em{font-style:normal;font-size:11px;color:var(--ice);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dots .d{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:700}
.dots .d i{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line2);display:block}
.dots .d i.on{background:var(--blue);border-color:var(--blue);box-shadow:0 0 12px -3px var(--glow)}
.dots .d i.na{border-style:dashed;opacity:.4}
.hbar{display:flex;flex-direction:column;gap:6px}
.hbar .lab{display:flex;justify-content:space-between;font-size:14px;font-weight:650}
.hbar .lab span{color:var(--muted);font-variant-numeric:tabular-nums}

/* Bible */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.bk{min-height:54px;border-radius:12px;background:rgba(8,11,18,.35);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px;text-align:left;font-size:12.5px;font-weight:700}
.bk i{display:block;height:4px;border-radius:9px;background:var(--track);overflow:hidden}
.bk i>u{display:block;height:100%;background:var(--ice)}
.bk.done{background:rgba(67,139,250,.22);border-color:rgba(67,139,250,.5)}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.chap{height:46px;border-radius:12px;border:1px solid var(--line2);font-weight:700;font-variant-numeric:tabular-nums}
.chap.on{background:var(--blue);border-color:var(--blue)}
.verse{font-family:var(--f-verse);font-style:italic;font-size:21px;line-height:1.38;color:#EAF2FF;text-wrap:pretty}
.verse-ref{font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ice)}
.card.faith-card{background:radial-gradient(100% 100% at 0% 0%,rgba(141,187,255,.14),transparent 60%),linear-gradient(180deg,#101D35,#0B1528)}

/* Forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>span{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.in{width:100%;min-height:54px;background:var(--field);border:1px solid var(--line2);border-radius:15px;padding:12px 14px;font-size:17px}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.in::placeholder{color:rgba(143,169,210,.5)}
.in.big{font-size:30px;font-weight:800;font-stretch:115%;text-align:center;min-height:72px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:99px;border:1px solid var(--line2);font-weight:700;font-size:14.5px;color:var(--muted);background:rgba(8,11,18,.3)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:15px;border:1px solid var(--line2);font-size:24px;font-weight:700;color:var(--ice);flex:none}
.stepper .in{text-align:center;font-weight:800;font-size:20px}
.opt{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:13px 15px;border-radius:16px;border:1px solid var(--line2);text-align:left;background:rgba(8,11,18,.3)}
.opt b{font-size:15.5px}
.opt span{font-size:13px;color:var(--muted)}
.opt.on{border-color:var(--blue);background:rgba(67,139,250,.16)}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.dock nav{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(16,29,53,.82);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--line2);border-radius:26px;padding:6px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
.dock a,.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-decoration:none;border-radius:18px}
.dock svg{width:23px;height:23px}
.dock .coach-btn svg{width:100%;height:100%}
/* real coach face */
.coach.real{position:relative}
.coach.real .face{position:absolute;inset:0;border-radius:26%/22%;overflow:hidden;background:#0C1730;box-shadow:0 0 0 1.5px rgba(0,212,255,.55),0 0 26px -4px rgba(0,212,255,.55);transition:box-shadow .35s;isolation:isolate;clip-path:inset(0 round 26% / 22%);-webkit-mask-image:-webkit-radial-gradient(white,black)}
.coach.real img,.coach.real video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;user-select:none;-webkit-user-select:none}
.coach.real .v-img{animation:faceBreathe 5.2s ease-in-out infinite;transform-origin:50% 85%}
.coach.real.talking .v-img{animation:faceTalk 2.6s ease-in-out infinite}
.coach.real.thinking .v-img{animation:faceThink 2.2s ease-in-out infinite}
.coach.real .v-talk{opacity:0;transition:opacity .28s}
.coach.real.talking .v-talk{opacity:1}

}

  if(n.startsWith('m-'))return{kind:'month',updatedAt:at,data:S.months[n.slice(2)]||{days:{},tx:[]}};

async function flush(){
  if(Sync.mode!=='cloud'||Sync.busy||!Sync.dirty.size)return;
  Sync.busy=true;
  const names=[...Sync.dirty];Sync.dirty.clear();
  for(const n of names){
    try{await col().doc(n).set(JSON.parse(JSON.stringify(body(n))));Sync.error=''}
    catch(e){Sync.dirty.add(n);Sync.error=(e&&e.code)||'error';
      if(e&&(e.code==='revoked'||e.code==='not_granted')){Sync.mode='local';toast('Cloud saving stopped. Your data is saved on this device.')}
      if(e&&e.code==='quota_exceeded')toast('Your storage is full. Delete a few photos to keep saving.');}
  }
  Sync.busy=false;
  if(Sync.dirty.size&&Sync.mode==='cloud'){clearTimeout(Sync.timer);Sync.timer=setTimeout(flush,Sync.error?8000:600)}
}
async function pull(){
  const snap=await col().where('kind','in',['core','month','journal','chat','brain']).get();
  let changed=false;const seen=new Set();
  for(const doc of snap.docs){
    const b=doc.data();if(!b)continue;seen.add(doc.id);
    const local=S.stamps[doc.id]||0, remote=b.updatedAt||0;
    if(remote>local){
      const data=JSON.parse(JSON.stringify(b.data||{}));
      if(doc.id==='core')S.core=data;else if(doc.id==='chat'){S.chat=data.log||[];S.chats=data.agents||{}}else if(doc.id==='brain'){S.brain=data}else if(doc.id.startsWith('m-'))S.months[doc.id.slice(2)]=data;else S.journal[doc.id.slice(2)]=data;
      S.stamps[doc.id]=remote;Sync.dirty.delete(doc.id);changed=true;
    }else if(local>remote)Sync.dirty.add(doc.id);
  }
  for(const n of Object.keys(S.stamps))if(!seen.has(n))Sync.dirty.add(n);
  if(changed){normalize();lsSet(LS_KEY,S);snapAll()}
  return changed;
}
async function boot(){
  const saved=lsGet(LS_KEY);
  if(saved&&saved.core)S=saved;
  normalize();snapAll();render();
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const id=user?await user.id():null;
      if(db&&id){Sync.db=db;Sync.uid=id;Sync.mode='cloud';await pull();flush()}
    }
  }catch(e){Sync.mode='local';Sync.error=(e&&e.code)||'error'}
  Sync.ready=true;if(S.core._mig){delete S.core._mig;saveCore()}render();
}

  if(Sync.mode==='cloud'&&!Sync.dirty.size&&!Sync.busy&&!SH){try{if(await pull())render();else render()}catch(e){}}
  else render();
});

async function loadPhotos(){
  if(PHOTOS)return PHOTOS;
  try{
    if(Sync.mode==='cloud'){const s=await col().where('kind','==','photo').get();PHOTOS=s.docs.map(d=>({id:d.id,...d.data()}))}
    else PHOTOS=lsGet(LS_PH)||[];
  }catch(e){PHOTOS=lsGet(LS_PH)||[]}
  PHOTOS.sort((a,b)=>a.date<b.date?1:-1);try{photoIndexSync()}catch(e){}return PHOTOS;
}
async function addPhoto(type,img,date,pose,noAnalyze){
  const p={id:'p-'+uid(),kind:'photo',type,pose:pose||(type==='face'?'face':'other'),date,img,updatedAt:Date.now()};
  await loadPhotos();
  if(Sync.mode==='cloud'){await col().doc(p.id).set(p)}
  else{const arr=[p,...PHOTOS];if(!lsSet(LS_PH,arr))throw new Error('full')}
  PHOTOS.unshift(p);PHOTOS.sort((a,b)=>a.date<b.date?1:-1);photoIndexSync();
  logEvent(type==='face'?'face':'body',`${type==='face'?'Face':'Progress'} photo added (${p.pose}, ${shortDate(date)})`,{date});
  if(!noAnalyze)setTimeout(()=>analyzePhoto(p.id),50);return p;
}
async function delPhoto(id){
  const old=(PHOTOS||[]).find(p=>p.id===id);if(Sync.mode==='cloud')await col().doc(id).delete();if(old)logEvent(old.type==='face'?'face':'body',`Deleted ${old.type} photo (${old.pose||'other'}, ${shortDate(old.date)})`,{date:old.date});
  PHOTOS=(PHOTOS||[]).filter(p=>p.id!==id);
  if(Sync.mode!=='cloud')lsSet(LS_PH,PHOTOS);photoIndexSync();
}

function totals(k){const d=dayR(k),t={k:0,p:0,c:0,f:0,na:(d.saltTsp||0)*2300,kk:0};(d.food||[]).forEach(e=>{t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f;t.na+=e.na||0;t.kk+=e.kk||0});return t}
function planFor(k){const P=S.core.plan;if(P.same)return P.all;const i=(pk(k).getDay()+6)%7;return P.days[i]||P.all}
function planSlots(k){const p=planFor(k)||{};const out=[];['b','l','d'].forEach(s=>{if(p[s])out.push({key:s,slot:s,mid:p[s]})});(p.s||[]).forEach((mid,i)=>{if(mid)out.push({key:'s'+i,slot:'s',mid})});return out}

function mealsDone(k){const g=new Set();(dayR(k).food||[]).forEach(e=>g.add(e.grp||e.meal));return g.size}

function potassiumCount(k){const d=dayR(k);const s=new Set();(d.food||[]).forEach(e=>{const f=food(e.fid);if(f&&f.K)s.add(e.fid);else if(!f&&(e.kk||0)>=300)s.add(e.n)});return s.size+(d.kExtra||0)}

function autoBody(a,k){

function weights(){const a=[];for(const m of Object.keys(S.months))for(const[k,d]of Object.entries(S.months[m].days||{}))if(d.weight)a.push([k,+d.weight]);return a.sort((x,y)=>x[0]<y[0]?-1:1)}
function avgBetween(W,from,to){const v=W.filter(([k])=>k>=from&&k<=to).map(x=>x[1]);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}

function band(){const e=EXP.find(x=>x[0]===S.core.profile.exp)||EXP[2];return e[2]}
function trend(W){
  const from=addD(TODAY,-20);const pts=W.filter(([k])=>k>=from&&k<=TODAY);
  const span=pts.length?diffD(pts[0][0],pts[pts.length-1][0]):0;
  if(pts.length<10||span<13)return{ok:false,n:pts.length,span};
  const xs=pts.map(([k])=>diffD(pts[0][0],k)),ys=pts.map(p=>p[1]);
  const mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let num_=0,den=0;xs.forEach((x,i)=>{num_+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});

}

  if(tr.pct<lo)return{state:'up',delta:150,tr,title:'Gaining slower than planned',text:`Over the last 3 weeks you averaged ${tr.lbwk>=0?'+':''}${r1(tr.lbwk)} lb/week (${r1(tr.pct)}% of body weight). Your target is ${lo}–${hi}%. Add about 150 kcal a day, mostly carbs.`};
  if(tr.pct>hi+0.1)return{state:'down',delta:-150,tr,title:'Gaining faster than needed',text:`You averaged +${r1(tr.lbwk)} lb/week (${r1(tr.pct)}%). Above ${hi}% a week, more of the extra weight tends to be fat. Remove about 150 kcal a day.`};
  return{state:'ok',tr,title:'On pace. Keep calories the same',text:`You averaged ${tr.lbwk>=0?'+':''}${r1(tr.lbwk)} lb/week (${r1(tr.pct)}% of body weight), inside your ${lo}–${hi}% target.`};

/* --- Targets --- */
function calcTargets(p,t){
  const kg=p.lb*0.4536,cm=(p.ft*12+p.inch)*2.54;
  const bmr=10*kg+6.25*cm-5*p.age+(p.sex==='f'?-161:5);
  const act=(ACTIVITY.find(a=>a[0]===p.activity)||ACTIVITY[3])[1];
  const maint=Math.round(bmr*act/10)*10;
  const kcal=Math.round((maint+t.surplus)/10)*10;
  const prot=Math.round(kg*t.pkg);
  const fat=Math.round(kcal*t.fatPct/100/9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return{maint,kcal,p:prot,f:fat,c:carb,kg};
}

function mealSum(p){const t={k:0,p:0,c:0,f:0};[p.b,p.l,p.d,...(p.s||[])].forEach(id=>{const m=mealById(id);if(m){const x=mealTotals(m);t.k+=x.k;t.p+=x.p;t.c+=x.c;t.f+=x.f}});return t}
function aggregate(keys){
  const agg={};keys.forEach(k=>planSlots(k).forEach(s=>{const m=mealById(s.mid);if(!m)return;m.items.forEach(it=>{const x=calc(it.fid,it.si,it.q);agg[it.fid]=(agg[it.fid]||0)+x.g})}));return agg;
}
function buyLabel(fid,g){
  const f=food(fid);if(!f)return '';
  if(RAW_YIELD[fid]){const raw=g/RAW_YIELD[fid];return `${r1(g/453.6)} lb cooked · buy about ${r1(raw/453.6)} lb raw`}
  if(DRY[fid]){const D=DRY[fid];return `${fmt(g)} g cooked · about ${r1(g/D.r/D.cup)} cups ${D.l}`}
  const sv=f.sv[0];if(f.custom&&f.noG)return `${r1(g/sv.g)} × ${sv.l}`;
  if(/egg|slice|medium|scoop|tortilla|bagel|can|avocado|egg white|fillet|thigh|breast/.test(sv.l))return `${Math.ceil(g/sv.g-0.05)} × ${sv.l}`;
  if(/cup/.test(sv.l)&&g>=sv.g)return `${r1(g/sv.g)} cups (${fmt(g)} g)`;
  return g>=454?`${r1(g/453.6)} lb`:`${fmt(g)} g`;
}
function groceryCard(){
  const gr=S.core.groceries,ws=weekStart(TODAY);if(gr.week!==ws){gr.week=ws;gr.checked={}}
  const sun=addD(ws,-1),keys=weekKeys(TODAY>=addD(ws,6)?addD(ws,6):sun).map((_,i)=>addD(TODAY,i));
  const agg=aggregate(keys);const ids=Object.keys(agg).sort((a,b)=>food(a).name<food(b).name?-1:1);
  const done=ids.filter(i=>gr.checked[i]).length+gr.extra.filter(x=>x.done).length,total=ids.length+gr.extra.length;

function prepCard(){
  const pd=[...(S.core.prepDays||[0,3])].sort();
  // upcoming prep days, each batch covering the days until the next prep day
  const days=Array.from({length:7},(_,i)=>addD(TODAY,i));
  const firstOf=dow=>days.find(k=>pk(k).getDay()===dow);
  const batches=pd.map((dow,i)=>{const nxt=pd[(i+1)%pd.length];const len=((nxt-dow+7)%7)||7;const from=firstOf(dow);return{dow,from,keys:Array.from({length:len},(_,j)=>addD(from,j))}}).sort((a,b)=>a.from<b.from?-1:1);
  return `<section class="card"><div class="card-head"><div class="t"><h2>PREP CALENDAR</h2></div></div>
  <div class="dots">${days.map(k=>{const isPrep=pd.includes(pk(k).getDay());return `<div class="d"><i class="${isPrep?(dayR(k).prepDone?'on':''):'na'}" style="${isPrep?'border-color:var(--blue)':''}"></i>${dowShort(k)}</div>`}).join('')}</div>
  ${batches.map((b,i)=>{const agg=aggregate(b.keys);const cook=Object.keys(agg).filter(id=>COOKED.has(id));const done=!!dayR(b.from).prepDone;
    return `<div class="stat" style="gap:8px"><div class="row between"><b style="font-size:16px">Prep · ${dowShort(b.from)} ${shortDate(b.from)}</b><span class="pill ${done?'solid':'quiet'}">${done?'Done':'To do'}</span></div>
    <span>Cook for ${dowShort(b.keys[0])}–${dowShort(b.keys[b.keys.length-1])} (${b.keys.length} days)</span>
    <div class="note">${cook.map(id=>`${esc(food(id).name)}: ${esc(buyLabel(id,agg[id]).split(' · ')[0])}`).join('<br>')||'Nothing to cook in this window.'}</div>
    <button class="btn sm ${done?'quiet':'ghost'}" data-a="prepDone" data-k="${b.from}">${done?'Mark not done':'Mark batch cooked'}</button></div>`}).join('')}
  <p class="tiny muted">${pd.length>1?'The midweek batch keeps every meal inside the 3–4 day fridge limit. If you freeze your meals, it can be a quick thaw-and-portion check instead.':'Add a midweek prep so cooked meals never sit more than 4 days.'}</p>
  <button class="link" data-a="editPrepDays">${I.cal} Change prep days</button></section>`;
}

V.reports=()=>{

  const pro=ks.map((k,i)=>!past[i]?null:totals(k).p>=t.p-5&&t.p>0);
  const wo=c.bodyList.find(x=>x.id==='workout'||/workout|gym|train/i.test(x.label));

    <div class="stack" style="gap:6px"><div class="row between"><span class="small" style="font-weight:700">Calories within 10% of target</span><span class="muted tiny">${cnt(cal)}/${days(cal)}</span></div>${dots7(cal,L)}</div>
    <div class="stack" style="gap:6px"><div class="row between"><span class="small" style="font-weight:700">Protein target hit</span><span class="muted tiny">${cnt(pro)}/${days(pro)}</span></div>${dots7(pro,L)}</div>

const ROUTES=['home','body','faith','money','discipline','journal','reports','prefs','setup','coach','progress','share','talk','workouts','sleep','appearance'];
function render(){

  app.innerHTML=V[r]();

  renderDock(r);
  afterRender(r);
}
function renderDock(r){
  if(r==='setup'&&!S.core.setupDone){$('#dock').innerHTML='';return}
  const it=(h,ic,l)=>`<a href="#${h}" class="${r===h?'on':''}" ${r===h?'aria-current="page"':''}>${ic}<span>${l}</span></a>`;
  $('#dock').innerHTML=`<nav aria-label="Main">${it('home',I.home,'HOME')}${it('body',I.body,'BODY')}<a ${talkAttrs()} class="coach-btn ${r==='coach'||r==='talk'?'on':''}" aria-label="Talk to Coach">${coachAvatar(58)}</a>${it('progress',I.chart,'PROGRESS')}${it('faith',I.faith,'FAITH')}</nav>`;
}
function afterRender(r){
  if(r==='talk'){paintTalk()}
  if(r!=='talk'&&LISTENING)stopListen();
  if(r==='coach'){paintChat();const box=$('#chat');if(box&&box.lastElementChild)box.lastElementChild.scrollIntoView({block:'end'})}
  if((r==='body'&&(UI.bodyTab==='progress'||UI.bodyTab==='face'))||r==='appearance')loadPhotos().then(()=>paintPhotos()).catch(()=>{});
}
function paintPhotos(){
  ['progress','face'].forEach(type=>{const el=$('#photos-'+type);if(!el)return;const list=(PHOTOS||[]).filter(p=>p.type===type);
    el.innerHTML=list.length?list.map(p=>`<button data-a="viewPhoto" data-id="${p.id}" aria-label="${type} photo ${p.pose||''} ${shortDate(p.date)}"><img src="${p.img}" alt="${type} photo ${shortDate(p.date)}" loading="lazy"><span>${shortDate(p.date)}${p.pose&&p.pose!=='face'&&p.pose!=='other'?' · '+p.pose:''}</span>${ANALYZING.has(p.id)?'<em class="ph-badge busy">Analyzing…</em>':p.analysis?'<em class="ph-badge">AI ✓</em>':''}</button>`).join(''):`<div class="empty" style="grid-column:1/-1">No photos yet.</div>`});
}

SHEETS.food=()=>{
  if(SH.step==='amount')return foodAmountSheet();
  if(SH.step==='custom')return customFoodSheet();
  return `${sheetHead(SH.forMeal?'Add ingredient':'Log food')}
  <div class="row" style="gap:10px"><input class="in" id="food-q" data-bind="foodq" placeholder="Search foods" value="${esc(SH.q||'')}" autocomplete="off" autofocus></div>
  ${SH.forMeal?'':`<div class="chips">${S.core.meals.slice(0,8).map(m=>`<button class="chip" data-a="logSaved" data-id="${m.id}">${I.star.replace('width="24" height="24"','width="14" height="14"')} ${esc(m.name)}</button>`).join('')}</div><p class="tiny muted" style="margin-top:-6px">Tap a saved meal to log all of it at once.</p>`}
  <div class="results" id="food-results">${foodResults()}</div>
  <button class="btn ghost" data-a="customFood">${I.plus} Create a food</button>`;
};
function foodResults(){
  const q=(SH.q||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  const all=[...S.core.foods,...Object.values(FOODS)];
  let list;
  if(!q.length){const rec=S.core.recent.map(food).filter(Boolean);list=[...rec,...all.filter(f=>!S.core.recent.includes(f.id))]}
  else list=all.filter(f=>q.every(w=>f.name.toLowerCase().includes(w)));
  if(!list.length)return `<div class="empty">No match. Tap “Create a food” to add it.</div>`;
  return list.slice(0,40).map(f=>{const s=f.sv[0];const x=calc(f.id,0,1);return `<button class="li" data-a="pickFood" data-id="${f.id}"><div class="main"><b>${esc(f.name)}${f.custom?' <span class="auto-tag">Mine</span>':''}</b><span>${esc(s.l)} · ${fmt(x.k)} kcal · ${r1(x.p)} g protein</span></div>${I.plus}</button>`}).join('');
}
function foodAmountSheet(){
  const f=food(SH.fid);const x=calc(SH.fid,SH.si,SH.q);
  const units=f.sv.map((s,i)=>[i,s.l]);if(!f.noG)units.push([-1,'grams']);
  return `${sheetHead(esc(f.name))}
  <div class="field"><span>UNIT</span><div class="chips">${units.map(([i,l])=>`<button class="chip ${SH.si===i?'on':''}" data-a="unit" data-v="${i}">${esc(l)}</button>`).join('')}</div></div>
  <div class="field"><span>${SH.si<0?'GRAMS':'HOW MANY'}</span><div class="stepper"><button data-a="qty" data-d="-1" aria-label="Less">−</button><input class="in num" id="qty-in" data-bind="qty" inputmode="decimal" value="${SH.q}"><button data-a="qty" data-d="1" aria-label="More">+</button></div></div>
  ${SH.forMeal?'':`<div class="field"><span>MEAL</span><div class="chips">${MEAL_SLOTS.map(([s,l])=>`<button class="chip ${SH.meal===s?'on':''}" data-a="mealPick" data-v="${s}">${l}</button>`).join('')}</div></div>`}
  <div class="grid2" id="food-prev">${prevStats(x)}</div>
  <button class="btn" data-a="addFood">${SH.edit?'Save changes':SH.forMeal?'Add to meal':'Add to '+(MEAL_SLOTS.find(m=>m[0]===SH.meal)||[])[1]}</button>
  ${SH.edit?`<button class="btn quiet" data-a="delEntry">${I.trash} Remove from log</button>`:`<button class="link" data-a="foodBack">${I.back} Back to search</button>`}`;
}
const prevStats=x=>`<div class="stat"><span>CALORIES</span><b>${fmt(x.k)}</b></div><div class="stat"><span>PROTEIN</span><b>${r1(x.p)} g</b></div><div class="stat"><span>CARBS</span><b>${r1(x.c)} g</b></div><div class="stat"><span>FAT</span><b>${r1(x.f)} g</b></div>`;

SHEETS.photo=()=>{const p=(PHOTOS||[]).find(x=>x.id===SH.id);if(!p)return sheetHead('Photo');
  const same=(PHOTOS||[]).filter(x=>x.id!==p.id&&x.type===p.type&&(x.pose||'other')===(p.pose||'other')).sort((a,b)=>a.date<b.date?1:-1);
  const cmp=SH.cmp&&(PHOTOS||[]).find(x=>x.id===SH.cmp);const a=p.analysis;
  const an=ANALYZING.has(p.id)?`<p class="note">Analyzing…</p>`:a?`<div class="stack an" style="gap:8px"><p class="note" style="margin:0"><b>${esc(a.summary||'')}</b></p>
    ${a.areas?`<div class="an-grid">${Object.entries(a.areas).filter(([k,v])=>v&&!/^not visible/i.test(v)).map(([k,v])=>`<div><span class="eyebrow">${esc(k)}</span><p>${esc(v)}</p></div>`).join('')}</div>`:''}
    ${['skin','puffiness','grooming'].filter(k=>a[k]).map(k=>`<div><span class="eyebrow">${k}</span><p class="small" style="margin:2px 0 0">${esc(a[k])}</p></div>`).join('')}
    ${a.vs_previous?`<div><span class="eyebrow">Vs previous</span><p class="small" style="margin:2px 0 0">${esc(a.vs_previous)}</p></div>`:''}
    ${(a.focus||a.tips||[]).length?`<div><span class="eyebrow">${a.focus?'Focus':'Tips'}</span><ul class="small" style="margin:4px 0 0;padding-left:18px">${(a.focus||a.tips).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    ${a.bodyfat_range?`<span class="tiny muted">Body fat from a photo, rough range: ${esc(a.bodyfat_range)}</span>`:''}
    <span class="tiny muted">${esc(a.limits||'A photo reading is an opinion, not a measurement.')}${a.photo_tips?' '+esc(a.photo_tips):''}</span></div>`:`<button class="btn ghost" data-a="analyzePh" data-id="${p.id}">${I.bolt} Analyze this photo</button>`;
  return `${sheetHead(`${p.type==='face'?'Face':'Progress'}${p.pose&&p.pose!=='face'?' · '+p.pose:''} · ${shortDate(p.date)}`)}
  ${cmp?`<div class="grid2"><figure class="cmp"><img src="${cmp.img}" alt="Earlier photo ${shortDate(cmp.date)}"><figcaption>${shortDate(cmp.date)}</figcaption></figure><figure class="cmp"><img src="${p.img}" alt="Photo ${shortDate(p.date)}"><figcaption>${shortDate(p.date)}</figcaption></figure></div>`:`<img src="${p.img}" alt="Photo from ${shortDate(p.date)}" style="width:100%;border-radius:18px">`}
  ${same.length?`<div class="stack" style="gap:6px"><span class="eyebrow">Compare side by side</span><div class="cmp-strip">${same.slice(0,8).map(x=>`<button data-a="cmpPh" data-id="${x.id}" class="${SH.cmp===x.id?'on':''}"><img src="${x.img}" alt="${shortDate(x.date)}"><span>${shortDate(x.date)}</span></button>`).join('')}</div></div>`:''}
  ${an}
  ${a&&!ANALYZING.has(p.id)?`<button class="link tiny" data-a="analyzePh" data-id="${p.id}" style="align-self:flex-start">Analyze again</button>`:''}
  <button class="btn ghost" data-a="askAboutPh" data-id="${p.id}">${I.send} Ask ${p.type==='face'?'Glow':'Trainer'} about it</button>
  ${UI.confirm==='photo'?`<button class="btn" data-a="delPhoto">Yes, delete this photo</button>`:`<button class="btn quiet" data-a="askDelPhoto">${I.trash} Delete photo</button>`}`};
SHEETS.confirm=()=>`${sheetHead(SH.title)}<p class="note">${SH.text}</p><button class="btn" data-a="${SH.ok}">${SH.okLabel}</button><button class="btn quiet" data-a="closeSheet">Cancel</button>`;

/* ================= Actions ================= */
const A={};
A.analyzePh=el=>{analyzePhoto(el.dataset.id);renderSheet()};
A.cmpPh=el=>{SH.cmp=SH.cmp===el.dataset.id?null:el.dataset.id;renderSheet()};
A.askAboutPh=el=>{const p=(PHOTOS||[]).find(x=>x.id===el.dataset.id);closeSheet(true);UI.agent=p&&p.type==='face'?'glow':'trainer';location.hash='coach/'+UI.agent;setTimeout(()=>coachSend(`Look at my ${p?p.pose:''} ${p&&p.type==='face'?'face':'progress'} photo from ${p?shortDate(p.date):''} and compare it with my earlier photos. What improved and what needs work?`),120)};
A.pose=el=>{UI.pose=el.dataset.v;render()};
A.closeSheet=()=>closeSheet();
A.quick=()=>openSheet({type:'quick'});
A.toggleCat=el=>{const k=el.dataset.c;const was=UI.openCat;UI.openCat=was===k?null:k;
  document.querySelectorAll('.cat').forEach(c=>{const on=c.id==='cat-'+UI.openCat;c.classList.toggle('open',on);c.querySelector('.cat-head').setAttribute('aria-expanded',on)})};
A.openCat=el=>{const map={body:'body',faith:'faith',disc:'disc',journal:'journal'};UI.openCat=map[el.dataset.c];render();const c=$('#cat-'+UI.openCat);if(c)c.scrollIntoView({behavior:'smooth',block:'start'})};
A.prioDone=el=>{const d=dayW(TODAY);d.prioDone=d.prioDone||[];d.prioDone[+el.dataset.i]=!d.prioDone[+el.dataset.i];saveDay(TODAY);render()};
A.water=el=>{const d=dayW(TODAY),i=+el.dataset.i;d.water=(d.water||0)===i+1?i:i+1;saveDay(TODAY);render()};
A.waterPlus=()=>{const d=dayW(TODAY);d.water=(d.water||0)+1;saveDay(TODAY);closeSheet();toast(`Water: ${d.water} glasses`)};
A.sleep=el=>{const d=dayW(TODAY);d.sleep=clamp(r1((d.sleep||(el.dataset.d>0?6.5:7.5))+ +el.dataset.d),0,14);saveDay(TODAY);render()};
A.alc=el=>{const d=dayW(TODAY);d.alcohol=Math.max(0,(d.alcohol||0)+ +el.dataset.d);saveDay(TODAY);render()};
A.kExtra=()=>{const d=dayW(TODAY);d.kExtra=(d.kExtra||0)+1;saveDay(TODAY);render()};
A.setDay=el=>{const d=dayW(TODAY),f=el.dataset.f;let v=el.dataset.v;if(f==='puff')v=+v;d[f]=d[f]===v?undefined:v;if(d[f]===undefined)delete d[f];saveDay(TODAY);render()};
function toggleCk(field,list,id,doneFn){
  const it=S.core[list].find(x=>x.id===id);if(!it)return;
  const d=dayW(TODAY);d[field]=d[field]||{};
  if(it.auto&&autoBody(it.auto,TODAY)&&!d[field][id]){toast('This one checks itself from your log.');return}
  d[field][id]=!d[field][id];saveDay(TODAY);render();
}
A.bodyCk=el=>toggleCk('body','bodyList',el.dataset.id);
A.faithCk=el=>toggleCk('faith','faithList',el.dataset.id);
A.taskCk=el=>{const d=dayW(TODAY);d.tasks=d.tasks||{};d.tasks[el.dataset.id]=!d.tasks[el.dataset.id];d.taskTotal=S.core.tasks.length;saveDay(TODAY);render()};

A.faithTab=el=>{UI.faithTab=el.dataset.v;render()};
A.jTab=el=>{UI.jTab=el.dataset.v;render()};

A.jDay=el=>{const n=addD(UI.jDate,+el.dataset.d);if(n<=TODAY){UI.jDate=n;render()}};

A.openJournal=el=>{UI.jTab=el.dataset.v||(new Date().getHours()<15?'m':'e');UI.jDate=TODAY;closeSheet(true);go('journal')};
A.moneyM=el=>{const n=addM(UI.moneyM,+el.dataset.d);if(n<=mk(TODAY)){UI.moneyM=n;render()}};

/* food logging */
A.logFood=el=>{openSheet({type:'food',step:'search',q:'',meal:(el&&el.dataset.m)||defaultMeal(),date:UI.route==='body'&&UI.bodyTab==='food'?UI.foodDate:TODAY})};

let SAMPLE=null,SAMPLE_P=null,LIMITS=null,AI_OFF='';
function getSample(){
  if(SAMPLE_P)return SAMPLE_P;
  SAMPLE_P=(async()=>{
    if(!window.claude||typeof window.claude.use!=='function'){AI_OFF='Open Steadfast inside the Claude app or claude.ai to use Coach.';return null}
    const s=await window.claude.use('sample');
    if(!s){AI_OFF='Coach isn’t available in this view.';return null}
    try{LIMITS=await s.limits()}catch(e){LIMITS=null}
    SAMPLE=s;return s;
  })();
  return SAMPLE_P;
}

BULK + GLOW-UP RULES

    const M=JSON.parse(sn.months),J=JSON.parse(sn.journal);

function applyJournal(section,fields,text,say,k=TODAY){

  if(section==='prayer'){j.prayer=[j.prayer,text||fields.text].filter(Boolean).join('\n\n');saveJ(k);say&&say('Saved to prayer journal');return{ok:true}}

  allowed.forEach(f=>{if(fields[f]){j[key][f]=[j[key][f],String(fields[f])].filter(Boolean).join('\n')}});

  saveJ(k);say&&say(`Saved ${section} journal${k!==TODAY?' ('+shortDate(k)+')':''}`);return{ok:true};
}

function mdLite(s){
  const lines=esc(s).split('\n');let out='',inList=false;
  lines.forEach(l=>{const b=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^\s*[-•]\s+/.test(l)){if(!inList){out+='<ul>';inList=true}out+=`<li>${b.replace(/^\s*[-•]\s+/,'')}</li>`}
    else{if(inList){out+='</ul>';inList=false}out+=b.trim()?`<p>${b}</p>`:''}});

async function coachSend(text,files){

}

A.aiJournal=async()=>{

  const sec=UI.jTab==='m'?'morning':'evening';

  try{
    const r=await sample.json(`Nathan talked through his ${sec} journal out loud. Sort what he said into these journal fields, in first person, keeping his words and meaning, cleaned up into clear short sentences. Leave a field as "" if he didn't cover it. Do not invent anything.\nReply with only JSON: ${fields}\n\nWhat he said:\n"""${txt.slice(0,6000)}"""`,{modelTier:'quick',cache:false});
    const f=r&&typeof r==='object'?r:{};const k=UI.jDate;const j=jW(k);const key=sec==='morning'?'m':'e';j[key]=j[key]||{};

    if(key==='e'&&f.disciplined){const s=String(f.disciplined).toLowerCase();j.e.discRate=/^no|not really|didn/.test(s)?'No':/mostly|kind of|somewhat/.test(s)?'Mostly':/^yes|yeah|stayed/.test(s)?'Yes':j.e.discRate}

/* ---------- Progress page ---------- */
function neonDual(W,days=84){
  const from=addD(TODAY,-days+1);
  const wPts=[];for(let i=0;i<days;i++){const k=addD(from,i);const a=avg7(W,k);if(a!=null&&W.some(([kk])=>kk<=k&&kk>=addD(k,-6)))wPts.push([k,a])}
  const waist=[];for(const m of Object.keys(S.months))for(const[k,x]of Object.entries(S.months[m].days||{}))if(x.waist&&k>=from)waist.push([k,+x.waist]);waist.sort((a,b)=>a[0]<b[0]?-1:1);
  if(wPts.length<2&&waist.length<2)return `<div class="empty">Log a few weigh-ins (and a weekly waist) and your neon trend lines show up here.</div>`;
  const w=340,h=190,pl=34,pr=34,pt=16,pb=26;const X=k=>pl+diffD(from,k)/(days-1)*(w-pl-pr);
  const rng=(arr,minSpan)=>{if(!arr.length)return[0,1];let lo=Math.min(...arr.map(p=>p[1])),hi=Math.max(...arr.map(p=>p[1]));if(hi-lo<minSpan){const m=(hi+lo)/2;lo=m-minSpan/2;hi=m+minSpan/2}return[lo,hi]};
  const[wl,wh]=rng(wPts,3),[ql,qh]=rng(waist,1.5);
  const Yw=v=>pt+(wh-v)/(wh-wl)*(h-pt-pb),Yq=v=>pt+(qh-v)/(qh-ql)*(h-pt-pb);
  const path=(pts,Y)=>pts.map(([k,v],i)=>`${i?'L':'M'}${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const grid=[0,.5,1].map(f=>pt+f*(h-pt-pb));
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weight and waist trends, last 12 weeks">
  <defs><filter id="glowB" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  ${grid.map(y=>`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="rgba(141,187,255,.1)"/>`).join('')}
  ${wPts.length>1?`<text x="${pl-5}" y="${grid[0]+4}" text-anchor="end" fill="#6FB2FF" font-size="10.5" font-family="Archivo">${r1(wh)}</text><text x="${pl-5}" y="${grid[2]+4}" text-anchor="end" fill="#6FB2FF" font-size="10.5" font-family="Archivo">${r1(wl)}</text>
  <path d="${path(wPts,Yw)}" fill="none" stroke="#438BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowB)"/>
  <circle cx="${X(wPts[wPts.length-1][0])}" cy="${Yw(wPts[wPts.length-1][1])}" r="4.5" fill="#fff" stroke="#438BFA" stroke-width="2.5"/>`:''}
  ${waist.length>1?`<text x="${w-pr+5}" y="${grid[0]+4}" fill="#FF6B84" font-size="10.5" font-family="Archivo">${r1(qh)}"</text><text x="${w-pr+5}" y="${grid[2]+4}" fill="#FF6B84" font-size="10.5" font-family="Archivo">${r1(ql)}"</text>
  <path d="${path(waist,Yq)}" fill="none" stroke="#FF3B5C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowB)"/>
  ${waist.map(([k,v])=>`<circle cx="${X(k)}" cy="${Yq(v)}" r="3" fill="#FF3B5C"/>`).join('')}`:''}
  <text x="${pl}" y="${h-7}" fill="#8FA9D2" font-size="10.5" font-family="Archivo">${shortDate(from)}</text><text x="${w-pr}" y="${h-7}" text-anchor="end" fill="#8FA9D2" font-size="10.5" font-family="Archivo">Today</text>
  </svg><div class="legend"><span><i style="background:#438BFA"></i>Weight, 7-day avg (lb)</span><span><i style="background:#FF3B5C"></i>Waist (in)</span></div>`;
}
function e1rm(w,r){return w&&r?w*(1+Math.min(r,12)/30):0}
function strengthData(){const map={};for(const m of Object.keys(S.months))for(const[k,x]of Object.entries(S.months[m].days||{}))(x.workouts||[]).forEach(wo=>(wo.ex||[]).forEach(e=>{if(!e.w||!e.reps)return;const n=e.name.trim().toLowerCase();const v=e1rm(e.w,e.reps);map[n]=map[n]||{name:e.name,pts:{}};map[n].pts[k]=Math.max(map[n].pts[k]||0,v)}));return Object.values(map).map(o=>({name:o.name,pts:Object.entries(o.pts).sort((a,b)=>a[0]<b[0]?-1:1)})).filter(o=>o.pts.length).sort((a,b)=>b.pts.length-a.pts.length)}
function sparkNeon(pts,color='#00D4FF',label=''){
  if(pts.length<2)return `<div class="empty">Log this lift on two different days to see the line.</div>`;
  const w=320,h=120,p=18;const xs=pts.map(([k])=>k),vs=pts.map(x=>x[1]);const lo=Math.min(...vs),hi=Math.max(...vs)+(Math.max(...vs)===Math.min(...vs)?1:0);const span=diffD(xs[0],xs[xs.length-1])||1;
  const X=k=>p+diffD(xs[0],k)/span*(w-2*p),Y=v=>p+(hi-v)/(hi-lo||1)*(h-2*p);
  const d=pts.map(([k,v],i)=>`${i?'L':'M'}${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}"><defs><filter id="glowC" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowC)"/>${pts.map(([k,v])=>`<circle cx="${X(k)}" cy="${Y(v)}" r="3.4" fill="${color}"/>`).join('')}<text x="${p}" y="${h-3}" fill="#8FA9D2" font-size="10.5" font-family="Archivo">${shortDate(xs[0])}</text><text x="${w-p}" y="${h-3}" text-anchor="end" fill="#8FA9D2" font-size="10.5" font-family="Archivo">${shortDate(xs[xs.length-1])}</text></svg>`;
}
V.progress=()=>{
  const c=S.core,W=weights(),cur=avg7(W),g=c.goal,gained=cur!=null&&g.startWeight?cur-g.startWeight:null,co=coach(W);
  const cis=c.checkins||[],first=cis[0],last=cis[cis.length-1];
  const sd=strengthData();if(!UI.lift||!sd.find(x=>x.name===UI.lift))UI.lift=sd[0]&&sd[0].name;const lift=sd.find(x=>x.name===UI.lift);
  const liftGain=lift&&lift.pts.length>1?lift.pts[lift.pts.length-1][1]-lift.pts[0][1]:null;
  const weeks=12,start=addD(weekStart(TODAY),-(weeks-1)*7);

async function uploadFace(kind,file){

  if(file.size>max){toast(kind==='img'?'That photo is too big.':'That clip is too big. Keep it under 20 MB (about 5–8 seconds).');return}

  const as=await getAssets();

    try{const d=await shrinkImage(file);S.core.coach.face=Object.assign({},S.core.coach.face,{img:d});saveCore();render();toast('Coach photo saved on this device')}catch(e){toast('That photo didn’t work.')}
    return;
  }
  toast(kind==='img'?'Uploading photo…':'Uploading clip…');
  try{const r=await as.upload(file);S.core.coach.face=Object.assign({},S.core.coach.face,{[kind]:r.url});saveCore();render();toast(kind==='img'?'Coach has a new face':'Clip added. Coach is moving now.')}

  if(b==='j'){const o=jW(UI.jDate);(o[el.dataset.s]=o[el.dataset.s]||{})[el.dataset.f]=el.value;clearTimeout(jTimer);jTimer=setTimeout(()=>{saveJ(UI.jDate);const s=$('#j-saved');if(s)s.textContent='Saved'},500);return}
  if(b==='pj'){jW(TODAY).prayer=el.value;clearTimeout(jTimer);jTimer=setTimeout(()=>{saveJ(TODAY);const s=$('#pj-saved');if(s)s.textContent='Saved'},500);return}
  if(b==='foodq'){SH.q=el.value;$('#food-results').innerHTML=foodResults();return}

});
document.addEventListener('change',e=>{

  if(el.dataset.ci){SH.files=[...(el.files||[])].slice(0,3);SH.trained=$('#ci-trained').value;el.value='';renderSheet();return}
  if(el.dataset.photo){const file=el.files&&el.files[0];el.value='';if(!file)return;toast('Saving photo…');

  if(c==='work'){S.core.profile.work=el.value.slice(0,300);saveCore();return}
  if(c==='wake'||c==='bed'){S.core.sched=S.core.sched||{};S.core.sched[c]=el.value;saveCore();render();return}

  if(c==='plan'){const p=curPlan();if(el.dataset.s==='s')p.s[+el.dataset.i]=el.value;else p[el.dataset.s]=el.value;saveCore();render();return}
  if(c==='wdate'){SH.date=el.value&&el.value<=TODAY?el.value:TODAY;renderSheet();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&SH)closeSheet();
